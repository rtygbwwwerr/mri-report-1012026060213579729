<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MRI 影像查看器</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #1a1a1a;
    --border: #333;
    --accent: #4fc3f7;
    --text: #e0e0e0;
    --muted: #888;
    --thumb-size: 80px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .logo {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .badge {
    margin-left: auto;
    background: #263238;
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 12px;
    white-space: nowrap;
  }

  /* ── Series tabs ── */
  .series-tabs {
    display: flex;
    overflow-x: auto;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .series-tabs::-webkit-scrollbar { display: none; }
  .series-tab {
    flex-shrink: 0;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .series-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ── Main viewer ── */
  .viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Image display */
  .img-wrap {
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    min-height: 200px;
    touch-action: pinch-zoom pan-x pan-y;
  }
  .img-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Overlay info */
  .overlay-info {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.55);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    color: #ccc;
    pointer-events: none;
  }
  .overlay-nav {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    color: #fff;
    pointer-events: none;
  }

  /* Swipe hint */
  .swipe-hint {
    position: absolute;
    right: 10px; bottom: 12px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    pointer-events: none;
  }

  /* ── Controls bar ── */
  .controls {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-nav {
    background: #263238;
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-nav:active { background: #37474f; }
  .btn-play {
    background: var(--accent);
    color: #000;
    width: 40px; height: 40px;
    border: none;
    font-size: 18px;
    flex-shrink: 0;
  }
  .slider-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .frame-label {
    font-size: 12px;
    color: var(--muted);
    min-width: 42px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ── Filmstrip ── */
  .filmstrip {
    background: #111;
    border-top: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 4px;
    display: flex;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: #333 #111;
  }
  .filmstrip::-webkit-scrollbar { height: 4px; }
  .filmstrip::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  .thumb {
    flex-shrink: 0;
    width: var(--thumb-size);
    height: var(--thumb-size);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s;
    position: relative;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb.active { border-color: var(--accent); }
  .thumb .tn { position: absolute; bottom: 2px; right: 3px; font-size: 9px; color: rgba(255,255,255,0.6); }

  /* ── Speed selector ── */
  .speed-btn {
    background: #263238;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 7px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .speed-btn.active { color: var(--accent); border-color: var(--accent); }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 999;
    gap: 16px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--muted); font-size: 14px; }

  @media (min-width: 600px) {
    :root { --thumb-size: 96px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>正在加载影像数据...</p>
</div>

<header>
  <div class="logo">🏥</div>
  <h1>MRI 影像查看器 <span style="font-weight:400;color:var(--muted);font-size:13px">2026年6月2日</span></h1>
  <div class="badge" id="total-badge">共 0 帧</div>
</header>

<div class="series-tabs" id="series-tabs"></div>

<div class="viewer">
  <div class="img-wrap" id="img-wrap">
    <img id="main-img" src="" alt="MRI影像" draggable="false">
    <div class="overlay-info" id="overlay-info">序列 1 / 1</div>
    <div class="overlay-nav" id="overlay-nav">1 / 1</div>
    <div class="swipe-hint">← 左右滑动切帧 →</div>
  </div>

  <div class="controls">
    <button class="btn-nav" id="btn-prev" title="上一帧">&#8249;</button>
    <button class="btn-nav btn-play" id="btn-play" title="播放">&#9654;</button>
    <button class="btn-nav" id="btn-next" title="下一帧">&#8250;</button>
    <div class="slider-wrap">
      <input type="range" id="frame-slider" min="0" value="0">
      <span class="frame-label" id="frame-label">1/1</span>
    </div>
    <button class="speed-btn active" data-fps="4">4fps</button>
    <button class="speed-btn" data-fps="8">8fps</button>
    <button class="speed-btn" data-fps="15">15fps</button>
  </div>
</div>

<div class="filmstrip" id="filmstrip"></div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────
let seriesData = [];
let curSeries = 0;
let curFrame  = 0;
let playing   = false;
let fps       = 4;
let timer     = null;

// ── DOM refs ─────────────────────────────────────────────────────────────
const mainImg     = document.getElementById('main-img');
const overlayInfo = document.getElementById('overlay-info');
const overlayNav  = document.getElementById('overlay-nav');
const frameSlider = document.getElementById('frame-slider');
const frameLabel  = document.getElementById('frame-label');
const filmstrip   = document.getElementById('filmstrip');
const seriesTabs  = document.getElementById('series-tabs');
const btnPlay     = document.getElementById('btn-play');
const totalBadge  = document.getElementById('total-badge');
const loading     = document.getElementById('loading');

// ── Load manifest ─────────────────────────────────────────────────────────
fetch('manifest.json')
  .then(r => r.json())
  .then(data => {
    seriesData = data;
    const total = data.reduce((s, d) => s + d.images.length, 0);
    totalBadge.textContent = `共 ${total} 帧`;
    buildTabs();
    selectSeries(0);
    loading.style.display = 'none';
  })
  .catch(() => {
    loading.querySelector('p').textContent = '加载失败，请确认 manifest.json 存在于同目录';
  });

// ── Build series tabs ─────────────────────────────────────────────────────
function buildTabs() {
  seriesTabs.innerHTML = '';
  seriesData.forEach((s, i) => {
    const tab = document.createElement('div');
    tab.className = 'series-tab' + (i === 0 ? ' active' : '');
    tab.textContent = s.name + `（${s.images.length}帧）`;
    tab.addEventListener('click', () => selectSeries(i));
    seriesTabs.appendChild(tab);
  });
}

// ── Select series ─────────────────────────────────────────────────────────
function selectSeries(idx) {
  stopPlay();
  curSeries = idx;
  curFrame  = 0;
  document.querySelectorAll('.series-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  const s = seriesData[idx];
  overlayInfo.textContent = s.name + `（${s.images.length}帧）`;
  frameSlider.max = s.images.length - 1;
  buildFilmstrip();
  showFrame(0);
}

// ── Build filmstrip ───────────────────────────────────────────────────────
function buildFilmstrip() {
  filmstrip.innerHTML = '';
  const s = seriesData[curSeries];
  s.images.forEach((img, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'thumb' + (i === 0 ? ' active' : '');
    thumb.innerHTML = `<img src="${s.folder}/${img}" loading="lazy"><span class="tn">${i + 1}</span>`;
    thumb.addEventListener('click', () => showFrame(i));
    filmstrip.appendChild(thumb);
  });
}

// ── Show frame ────────────────────────────────────────────────────────────
function showFrame(idx) {
  const s = seriesData[curSeries];
  if (idx < 0) idx = s.images.length - 1;
  if (idx >= s.images.length) idx = 0;
  curFrame = idx;

  mainImg.src = `${s.folder}/${s.images[idx]}`;
  overlayNav.textContent = `${idx + 1} / ${s.images.length}`;
  frameSlider.value = idx;
  frameLabel.textContent = `${idx + 1}/${s.images.length}`;

  // Update filmstrip highlight & scroll into view
  const thumbs = filmstrip.querySelectorAll('.thumb');
  thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));
  if (thumbs[idx]) {
    thumbs[idx].scrollIntoView({ inline: 'center', behavior: 'smooth' });
  }
}

// ── Play / Pause ──────────────────────────────────────────────────────────
function startPlay() {
  playing = true;
  btnPlay.innerHTML = '&#9646;&#9646;';
  btnPlay.style.fontSize = '14px';
  timer = setInterval(() => showFrame(curFrame + 1), 1000 / fps);
}
function stopPlay() {
  playing = false;
  clearInterval(timer);
  btnPlay.innerHTML = '&#9654;';
  btnPlay.style.fontSize = '18px';
}

btnPlay.addEventListener('click', () => playing ? stopPlay() : startPlay());

// ── Slider ────────────────────────────────────────────────────────────────
frameSlider.addEventListener('input', e => {
  stopPlay();
  showFrame(parseInt(e.target.value));
});

// ── Prev / Next ───────────────────────────────────────────────────────────
document.getElementById('btn-prev').addEventListener('click', () => { stopPlay(); showFrame(curFrame - 1); });
document.getElementById('btn-next').addEventListener('click', () => { stopPlay(); showFrame(curFrame + 1); });

// ── Speed buttons ─────────────────────────────────────────────────────────
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    fps = parseInt(btn.dataset.fps);
    if (playing) { stopPlay(); startPlay(); }
  });
});

// ── Swipe gesture ─────────────────────────────────────────────────────────
let touchStartX = 0;
const imgWrap = document.getElementById('img-wrap');
imgWrap.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
imgWrap.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) {
    stopPlay();
    showFrame(dx < 0 ? curFrame + 1 : curFrame - 1);
  }
}, { passive: true });

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stopPlay(); showFrame(curFrame + 1); }
  else if (e.key === 'ArrowLeft') { stopPlay(); showFrame(curFrame - 1); }
  else if (e.key === ' ') { e.preventDefault(); playing ? stopPlay() : startPlay(); }
});
</script>
</body>
</html>
